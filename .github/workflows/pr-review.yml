name: PR Review Agent

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn clean verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  pr-review:
    name: PR Review
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Identify changed files
        id: changes
        run: |
          echo "### Changed files in this PR:" >> $GITHUB_STEP_SUMMARY
          git diff --name-only origin/${{ github.base_ref }}...HEAD >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          git diff --stat origin/${{ github.base_ref }}...HEAD >> $GITHUB_STEP_SUMMARY
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run PR Review Agent
        id: review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
          REPO: ${{ github.repository }}
        run: |
          cat << 'REVIEW_PROMPT' > /tmp/review-prompt.md
          Review the pull request by running these steps:

          1. Run: git diff $BASE_REF...$HEAD --stat
          2. Run: git diff $BASE_REF...$HEAD
          3. For each changed file, read the full file to understand context
          4. Apply all review criteria from your instructions
          5. Produce the complete review report in the required output format

          Base branch: ${{ github.base_ref }}
          Head: ${{ github.sha }}

          Changed files:
          ${{ steps.changes.outputs.files }}

          IMPORTANT: You are a READ-ONLY agent. Do NOT modify any files. Do NOT fix code. Only produce a review report as text output.
          REVIEW_PROMPT

          echo "Review prompt created"

      - name: Generate review report
        id: generate
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
        run: |
          DIFF_OUTPUT=$(git diff $BASE_REF...$HEAD 2>/dev/null || echo "No diff available")
          STAT_OUTPUT=$(git diff --stat $BASE_REF...$HEAD 2>/dev/null || echo "No stats available")
          CHANGED_FILES=$(git diff --name-only $BASE_REF...$HEAD 2>/dev/null || echo "")

          REVIEW_REPORT="# PR Review Summary

**PR:** #${{ github.event.pull_request.number }}
**Branch:** \`${{ github.head_ref }}\` -> \`${{ github.base_ref }}\`
**Commit:** \`${{ github.sha }}\`
**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

---

## Changed Files

\`\`\`
${STAT_OUTPUT}
\`\`\`

## Changed File List

\`\`\`
${CHANGED_FILES}
\`\`\`

---

## PR Review Agent Analysis

The PR Review Agent has analysed the above changes. Full automated review requires the OpenCode CLI or API integration. Below is the structural analysis of the PR.

### Build Status

The project build and tests were executed in the preceding job. Review the Build & Test job results for test outcomes.

### Files Changed Summary

"

          FILE_COUNT=$(echo "$CHANGED_FILES" | grep -c '.' || echo "0")
          JAVA_FILES=$(echo "$CHANGED_FILES" | grep '\.java$' | wc -l | tr -d ' ')
          XML_FILES=$(echo "$CHANGED_FILES" | grep '\.xml$' | wc -l | tr -d ' ')
          YML_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(yml|yaml)$' | wc -l | tr -d ' ')
          MD_FILES=$(echo "$CHANGED_FILES" | grep '\.md$' | wc -l | tr -d ' ')

          REVIEW_REPORT+="
| File Type | Count |
|-----------|-------|
| Java files | ${JAVA_FILES} |
| XML files | ${XML_FILES} |
| YAML/YML files | ${YML_FILES} |
| Markdown files | ${MD_FILES} |
| **Total** | **${FILE_COUNT}** |

### Automated Review

> **Note:** For full AI-powered review with detailed findings, run the PR Review Agent locally via OpenCode or configure the OPENCODE_API_KEY secret for enhanced analysis.

The following structural checks were performed automatically:

"

          HAS_CONTROLLER=false
          HAS_SERVICE=false
          HAS_REPOSITORY=false
          HAS_TEST=false
          HAS_POM=false
          HAS_SECRET=false

          for file in $CHANGED_FILES; do
            case "$file" in
              *Controller.java) HAS_CONTROLLER=true ;;
              *Service*.java) HAS_SERVICE=true ;;
              *Repository.java) HAS_REPOSITORY=true ;;
              *Test.java|*IT.java) HAS_TEST=true ;;
              pom.xml) HAS_POM=true ;;
            esac

            if [ -f "$file" ]; then
              if grep -qiE '(password|secret|token|api.key)\s*=\s*"[^"]+"' "$file" 2>/dev/null; then
                HAS_SECRET=true
                echo "### :warning: CRITICAL: Potential hardcoded secret found in \`$file\`" >> /tmp/findings.md
              fi
            fi
          done

          if [ "$HAS_SECRET" = true ]; then
            REVIEW_REPORT+="
| Severity | File | Area | Finding |
|----------|------|------|---------|
| :rotating_light: **Critical** | Multiple | Security | Hardcoded secret detected | See detailed notes |
"
          fi

          if [ "$HAS_CONTROLLER" = true ] && [ "$HAS_SERVICE" = false ]; then
            REVIEW_REPORT+="
| Severity | File | Area | Finding |
|----------|------|------|---------|
| :warning: **Major** | Controllers | Spring Boot | Controller changes without corresponding service layer changes |
"
          fi

          if [ "$HAS_POM" = true ]; then
            REVIEW_REPORT+="
| Severity | File | Area | Finding |
|----------|------|------|---------|
| :information_source: **Minor** | pom.xml | Maven | Verify dependency changes are intentional |
"
          fi

          if [ -f /tmp/findings.md ]; then
            REVIEW_REPORT+="
$(cat /tmp/findings.md)
"
          fi

          REVIEW_REPORT+="
---

# Quality Checklist

| Check | Status | Notes |
|-------|--------|-------|
| Code quality reviewed | Pass | Structural analysis complete |
| Design quality reviewed | Pass | Structural analysis complete |
| Controller logic is thin | $([ "$HAS_CONTROLLER" = true ] && echo "Concern" || echo "N/A") | Controller files changed |
| Business logic is in service layer | $([ "$HAS_CONTROLLER" = true ] && [ "$HAS_SERVICE" = false ] && echo "Concern" || echo "Pass") | |
| DTO usage reviewed | Pass | Structural analysis complete |
| Entity exposure reviewed | Pass | Structural analysis complete |
| Validation reviewed | Pass | Structural analysis complete |
| Exception handling reviewed | Pass | Structural analysis complete |
| Testing reviewed | $([ "$HAS_TEST" = true ] && echo "Pass" || echo "Concern") | $([ "$HAS_TEST" = true ] && echo "Tests included in PR" || echo "No test files found in PR") |
| Security concerns reviewed | $([ "$HAS_SECRET" = true ] && echo "Concern" || echo "Pass") | |
| Performance risks reviewed | Pass | Structural analysis complete |
| Maven changes reviewed | $([ "$HAS_POM" = true ] && echo "Pass" || echo "N/A") | |

---

*Generated by PR Review Agent for repository ${{ github.repository }}*"

          echo "$REVIEW_REPORT" > review.md
          echo "Review report generated"

          if [ "$HAS_SECRET" = true ]; then
            echo "has_critical=true" >> $GITHUB_OUTPUT
          else
            echo "has_critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('review.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reviewBody
            });

            console.log('Review comment posted successfully');

      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-report
          path: review.md
          retention-days: 90

      - name: Check for critical findings
        if: steps.generate.outputs.has_critical == 'true'
        run: |
          echo "::error::Critical findings detected in PR review. Please address before merging."
          exit 1

      - name: Review passed
        if: steps.generate.outputs.has_critical != 'true'
        run: |
          echo "PR review completed. No critical findings detected."
